<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meowdoku Restyle</title>
<style>
  body {
    margin: 0;
    padding: 12px;
    width: 220px;
    font: 13px system-ui, sans-serif;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 8px;
  }
  .option {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 4px;
    border-radius: 4px;
    cursor: pointer;
  }
  .option:hover {
    background: rgba(0, 0, 0, 0.05);
  }
  .option .row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .swatches {
    display: flex;
    gap: 2px;
  }
  .swatches span {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    flex: none;
  }
</style>
</head>
<body>
  <h1>Region palette</h1>
  <div id="options"></div>
  <script src="palettes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
